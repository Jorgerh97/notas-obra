<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Matriz en ordenador</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:Barlow,system-ui,sans-serif;color:#16324F;background:#F4F8FD}
a{color:#1F5FAE}a:hover{color:#16324F}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; box-sizing: border-box; background: #F4F8FD; font-family: Barlow, system-ui, sans-serif; color: #16324F; overflow: hidden; display: flex; flex-direction: column">
  <header style="flex: none; background: #FFFFFF; border-bottom: 3px solid #60A4F4; padding: 8px 24px; display: flex; align-items: center; gap: 16px">
    <h1 style="margin: 0; width: 250px; font: 700 26px/1 'Barlow Condensed', 'Arial Narrow', sans-serif">Notas</h1>
    <div style="display: flex; background: #F4F8FD; border: 1px solid #D6E2F0; border-radius: 10px; padding: 3px">
      <button style="min-height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; color: #52627A; font: 600 14px Barlow, sans-serif">Lista</button>
      <button style="min-height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; color: #52627A; font: 600 14px Barlow, sans-serif">Calendario</button>
      <button style="min-height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: #1F5FAE; color: #FFFFFF; font: 600 14px Barlow, sans-serif">Matriz</button>
    </div>
    <div style="flex-grow: 1"></div>
    <button style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: #FF7B0F; color: #16324F; font: 700 16px 'Barlow Condensed', sans-serif">Dictar</button>
    <button style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: #1F5FAE; color: #FFFFFF; font: 700 16px 'Barlow Condensed', sans-serif">+ Nueva nota</button>
  </header>

  <main style="flex-grow: 1; min-height: 0; padding: 14px 24px 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <h2 style="margin: 0; font: 700 24px/1 'Barlow Condensed', sans-serif">Matriz de prioridad</h2>
      <span style="font-size: 13px; color: #52627A">24 notas activas · ordenadas por fecha dentro de cada bloque</span>
      <div style="flex-grow: 1"></div>
      <label style="display: flex; align-items: center; gap: 8px; font: 600 13px Barlow, sans-serif; color: #52627A">Grupo filtrado
        <select style="min-height: 38px; border: 1px solid #9FB6D1; border-radius: 8px; padding: 0 8px; font: 600 14px Barlow, sans-serif; color: #16324F; background: #FFFFFF"><option>Ninguno · ver todo</option></select>
      </label>
    </div>

    <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{quads}}" as="q" hint-placeholder-count="4">
        <section style="min-height: 0; background: #FFFFFF; border: {{q.border}}; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: {{q.headBg}}; border-bottom: 1px solid #E6EEF8">
            <span style="width: 12px; height: 12px; border-radius: 3px; background: {{q.dot}}"></span>
            <h3 style="margin: 0; font: 700 19px/1 'Barlow Condensed', sans-serif; color: {{q.ink}}">{{q.name}}</h3>
            <span style="font-size: 13px; color: #52627A">{{q.count}}</span>
            <span style="flex-grow: 1"></span>
            <span style="font-size: 12px; color: {{q.hintInk}}; font-weight: 600">{{q.hint}}</span>
          </div>
          <div style="flex-grow: 1; min-height: 0; overflow-y: auto">
            <sc-for list="{{q.rows}}" as="r" hint-placeholder-count="4">
              <div style="display: grid; grid-template-columns: 22px minmax(0, 1fr) 170px 110px; align-items: center; gap: 10px; min-height: 38px; padding: 3px 14px; border-bottom: 1px solid #EEF3FA; font-size: 13px">
                <input type="checkbox" aria-label="Marcar como realizada" style="width: 16px; height: 16px; margin: 0; accent-color: #1F5FAE">
                <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><b style="font-weight: 600; font-size: 14px">{{r.title}}</b><span style="color: #52627A"> — {{r.body}}</span></span>
                <span style="color: #1F5FAE; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.tags}}</span>
                <span style="color: {{r.whenInk}}; white-space: nowrap; text-align: right">{{r.when}}</span>
              </div>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </main>

  <div style="position: absolute; left: 780px; top: 410px; width: 420px; transform: rotate(-1.5deg); background: #FFFFFF; border: 1px solid #9FB6D1; border-radius: 10px; box-shadow: 0 14px 30px rgba(22,50,79,.22); padding: 8px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px">
    <span style="width: 10px; height: 10px; border-radius: 3px; background: #1F5FAE"></span>
    <b style="font-weight: 600; font-size: 14px; flex-grow: 1">Muestras de pavimento</b>
    <span style="color: #52627A">⚑ vie 2 oct</span>
  </div>
  <div style="position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); background: #16324F; color: #FFFFFF; border-radius: 10px; padding: 10px 16px; font-size: 14px; display: flex; gap: 16px; align-items: center; box-shadow: 0 8px 20px rgba(22,50,79,.25)">
    Al soltar: «Muestras de pavimento» pasa de Normal a Alta
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    function r(title, body, tags, when, late) { return { title: title, body: body, tags: tags, when: when, whenInk: late ? '#C62828' : '#52627A' }; }
    function q(name, dot, ink, headBg, rows, count, drop) {
      return { name: name, dot: dot, ink: ink, headBg: headBg, rows: rows, count: count,
        border: drop ? '2px dashed #FF7B0F' : '1px solid #D6E2F0',
        hint: drop ? 'Soltar aquí para cambiar a Alta' : '', hintInk: '#8A3D00' };
    }
    var quads = [
      q('Crítica', '#C62828', '#C62828', '#FDECEC', [
        r('Revisar línea de vida en cubierta', 'Falta tramo junto al lucernario.', '#Mallorca245 #Seguridad', '⚑ hoy'),
        r('Confirmar hormigonado forjado P3', 'Confirmar camión a las 8:00.', '#Mallorca245 #Estructura', '🔔 mié 7:30')
      ], '2'),
      q('Alta', '#FF7B0F', '#8A3D00', '#FFF1E4', [
        r('Solicitar licencia de grúa', 'Plano de ocupación y seguro.', '#NaveSabadell', 'venció 25 sep', true),
        r('Llamar al industrial de clima', 'Fecha de montaje de máquinas.', '#NaveSabadell #Instalaciones', '🔔 hoy 12:30'),
        r('Preparar certificación mensual', 'Mediciones de estructura y albañilería.', '#Mallorca245', '⚑ mié 30'),
        r('Pedir oferta de carpintería exterior', 'Tres industriales. Checklist 1/3.', '#Mallorca245 #Carpintería', '⚑ vie 2 oct'),
        r('Oferta de climatización', 'Comparar dos propuestas.', '#Mallorca245 #Instalaciones', '⚑ 27 oct')
      ], '5', true),
      q('Normal', '#1F5FAE', '#1F5FAE', '#EAF3FE', [
        r('Revisar bajantes con el fontanero', 'Pasos de forjado antes de falsos techos.', '#Diagonal120', 'venció 26 sep', true),
        r('Reunión de obra', 'Llevar PDF de pendientes.', '#Diagonal120', '🔔 hoy 9:00'),
        r('Enviar acta a la DF', 'Acuerdos sobre fachada.', '#Mallorca245', '🔔 hoy 17:00'),
        r('Visita de la Propiedad', 'Recorrido por plantas 1 y 2.', '#Mallorca245', '🔔 vie 11:00'),
        r('Replanteo de tabiquería P3', 'Coordinar con el encargado.', '#Mallorca245 #Albañilería', '⚑ lun 5 oct'),
        r('Reunión de instalaciones', 'Clima y electricidad.', '#NaveSabadell', '🔔 13 oct'),
        r('Actualizar planning general', 'Mover fachada una semana.', '#Mallorca245', 'sin fecha'),
        r('Pedido de bloques', 'Confirmar cantidades.', '#Diagonal120', 'sin fecha')
      ], '13'),
      q('Baja', '#52627A', '#52627A', '#F4F8FD', [
        r('Fotos de avance para el archivo', 'Plantas 1 a 3.', '#Mallorca245', 'sin fecha'),
        r('Revisar señalética provisional', 'Cartel de acceso deteriorado.', '#Mallorca245 #Seguridad', 'sin fecha'),
        r('Ordenar documentación de calidad', 'Fichas técnicas de materiales.', '#Diagonal120', 'sin fecha')
      ], '4')
    ];
    return { quads: quads };
  }
}
</script>
</body>
</html>
