<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Matriz en móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:Barlow,system-ui,sans-serif;color:#16324F;background:#F4F8FD}
a{color:#1F5FAE}a:hover{color:#16324F}
</style>
</helmet>
<div style="width: 390px; height: 1060px; position: relative; box-sizing: border-box; background: #F4F8FD; font-family: Barlow, system-ui, sans-serif; color: #16324F; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 3px solid #60A4F4; padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: baseline; gap: 8px; min-height: 40px">
      <h1 style="margin: 0; font: 700 24px/1.6 'Barlow Condensed', 'Arial Narrow', sans-serif">Notas</h1>
      <span style="font-size: 13px; color: #52627A">24 activas</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #F4F8FD; border: 1px solid #D6E2F0; border-radius: 10px; padding: 3px">
      <button style="min-height: 34px; border: 0; border-radius: 8px; background: transparent; color: #52627A; font: 600 14px Barlow, sans-serif">Lista</button>
      <button style="min-height: 34px; border: 0; border-radius: 8px; background: transparent; color: #52627A; font: 600 14px Barlow, sans-serif">Calendario</button>
      <button style="min-height: 34px; border: 0; border-radius: 8px; background: #1F5FAE; color: #FFFFFF; font: 600 14px Barlow, sans-serif">Matriz</button>
    </div>
    <select aria-label="Grupo filtrado" style="min-height: 40px; border: 1px solid #9FB6D1; border-radius: 10px; padding: 0 8px; font: 600 14px Barlow, sans-serif; color: #16324F; background: #FFFFFF"><option>Grupo filtrado: ninguno · ver todo</option></select>
  </header>

  <main style="padding: 12px 16px 100px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{quads}}" as="q" hint-placeholder-count="4">
      <section style="background: #FFFFFF; border: 1px solid #D6E2F0; border-radius: 12px; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: {{q.headBg}}">
          <span style="width: 10px; height: 10px; border-radius: 3px; background: {{q.dot}}"></span>
          <h2 style="margin: 0; font: 700 17px/1 'Barlow Condensed', sans-serif; color: {{q.ink}}">{{q.name}}</h2>
          <span style="font-size: 13px; color: #52627A">{{q.count}}</span>
        </div>
        <sc-for list="{{q.rows}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 12px; border-top: 1px solid #EEF3FA">
            <span style="flex-grow: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span>
            <span style="flex: none; font-size: 11px; color: {{r.ink}}">{{r.d}}</span>
          </div>
        </sc-for>
        <div style="font-size: 13px; font-weight: 600; color: #1F5FAE; padding: {{q.morePad}}; border-top: {{q.moreBorder}}">{{q.more}}</div>
      </section>
    </sc-for>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #D6E2F0; padding: 10px 16px 18px; display: flex; gap: 10px">
    <button style="flex: 1; min-height: 48px; border: 0; border-radius: 24px; background: #FF7B0F; color: #16324F; font: 700 17px 'Barlow Condensed', sans-serif">Dictar</button>
    <button style="flex: 1; min-height: 48px; border: 0; border-radius: 24px; background: #1F5FAE; color: #FFFFFF; font: 700 17px 'Barlow Condensed', sans-serif">+ Nueva nota</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    function r(t, d, late) { return { t: t, d: d, ink: late ? '#C62828' : '#52627A' }; }
    function q(name, dot, ink, headBg, rows, count, more) {
      return { name: name, dot: dot, ink: ink, headBg: headBg, rows: rows, count: count,
        more: more || '', morePad: more ? '8px 12px' : '0', moreBorder: more ? '1px solid #EEF3FA' : '0' };
    }
    var quads = [
      q('Crítica', '#C62828', '#C62828', '#FDECEC', [
        r('Revisar línea de vida en cubierta', 'hoy'),
        r('Confirmar hormigonado forjado P3', 'mié 7:30')
      ], '2'),
      q('Alta', '#FF7B0F', '#8A3D00', '#FFF1E4', [
        r('Solicitar licencia de grúa', 'venció 25 sep', true),
        r('Llamar al industrial de clima', 'hoy 12:30'),
        r('Preparar certificación mensual', 'mié 30'),
        r('Pedir oferta de carpintería exterior', 'vie 2 oct'),
        r('Muestras de pavimento', 'vie 2 oct')
      ], '6', 'Ver 1 más'),
      q('Normal', '#1F5FAE', '#1F5FAE', '#EAF3FE', [
        r('Revisar bajantes con el fontanero', 'venció 26 sep', true),
        r('Reunión de obra', 'hoy 9:00'),
        r('Enviar acta a la DF', 'hoy 17:00'),
        r('Visita de la Propiedad', 'vie 11:00'),
        r('Replanteo de tabiquería P3', 'lun 5 oct')
      ], '12', 'Ver 7 más'),
      q('Baja', '#52627A', '#52627A', '#F4F8FD', [
        r('Fotos de avance para el archivo', 'sin fecha'),
        r('Revisar señalética provisional', 'sin fecha'),
        r('Ordenar documentación de calidad', 'sin fecha')
      ], '4', 'Ver 1 más')
    ];
    return { quads: quads };
  }
}
</script>
</body>
</html>
