<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dictar notas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:Barlow,system-ui,sans-serif;color:#16324F;background:#F4F8FD}
a{color:#1F5FAE}a:hover{color:#16324F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F8FD; font-family: Barlow, system-ui, sans-serif; color: #16324F; overflow: hidden; display: flex; flex-direction: column">
  <header style="background: #FFFFFF; border-bottom: 3px solid #60A4F4; padding: 8px; display: flex; align-items: center; gap: 8px">
    <button style="min-height: 44px; padding: 0 10px; border: 0; background: transparent; color: #1F5FAE; font: 600 16px Barlow, sans-serif">Cancelar</button>
    <h1 style="flex-grow: 1; margin: 0; text-align: center; font: 700 22px/1 'Barlow Condensed', sans-serif; padding-right: 80px">Dictar</h1>
  </header>
  <main style="flex-grow: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 18px">
    <p style="margin: 0; font-size: 15px; color: #52627A; line-height: 1.45">Habla con naturalidad. Si mencionas varias cosas, Claude las separa en notas distintas y detecta obra, persona, prioridad, fechas y alarmas.</p>
    <div style="background: #FFFFFF; border: 1px solid #D6E2F0; border-radius: 12px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="font: 700 52px/1 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums">01:24</div>
      <div style="font-size: 15px; font-weight: 600; color: #8A3D00">Grabando…</div>
      <div style="width: 100%; height: 56px; display: flex; align-items: center; gap: 3px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="40">
          <span style="flex: 1; border-radius: 2px; background: #60A4F4; height: {{b}}"></span>
        </sc-for>
      </div>
      <button aria-label="Pausar grabación" style="width: 88px; height: 88px; border-radius: 50%; border: 0; background: #FF7B0F; box-shadow: 0 0 0 8px #FFF1E4; display: grid; place-items: center; margin: 8px 0"><span style="width: 26px; height: 26px; border-radius: 4px; background: #FFFFFF"></span></button>
    </div>
    <div style="flex-grow: 1"></div>
    <button style="min-height: 54px; border: 0; border-radius: 10px; background: #1F5FAE; color: #FFFFFF; font: 700 19px 'Barlow Condensed', sans-serif">Terminar y analizar</button>
    <p style="margin: 0; font-size: 13px; color: #52627A; text-align: center">Sin cobertura, el audio se guarda y se analiza al recuperarla.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var h = [8,14,22,30,18,40,52,36,20,12,26,44,56,48,30,16,10,22,34,46,38,24,14,30,50,42,28,18,12,20,32,44,36,22,14,10,8,6,6,6];
    return { bars: h.map(function (x) { return x + 'px'; }) };
  }
}
</script>
</body>
</html>
