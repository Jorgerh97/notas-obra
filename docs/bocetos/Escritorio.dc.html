<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lista en ordenador</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:Barlow,system-ui,sans-serif;color:#16324F;background:#F4F8FD}
a{color:#1F5FAE}a:hover{color:#16324F}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F4F8FD; font-family: Barlow, system-ui, sans-serif; color: #16324F; overflow: hidden; display: flex; flex-direction: column">
  <header style="flex: none; background: #FFFFFF; border-bottom: 3px solid #60A4F4; padding: 8px 24px; display: flex; align-items: center; gap: 16px">
    <h1 style="margin: 0; width: 250px; font: 700 26px/1 'Barlow Condensed', 'Arial Narrow', sans-serif">Notas</h1>
    <div style="display: flex; background: #F4F8FD; border: 1px solid #D6E2F0; border-radius: 10px; padding: 3px">
      <button style="min-height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: #1F5FAE; color: #FFFFFF; font: 600 14px Barlow, sans-serif">Lista</button>
      <button style="min-height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; color: #52627A; font: 600 14px Barlow, sans-serif">Calendario</button>
      <button style="min-height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; color: #52627A; font: 600 14px Barlow, sans-serif">Matriz</button>
    </div>
    <label style="flex-grow: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; min-height: 40px; border: 1px solid #D6E2F0; border-radius: 10px; padding: 0 12px; background: #F4F8FD; color: #52627A">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" placeholder="Buscar en notas, etiquetas o personas" aria-label="Buscar" style="flex-grow: 1; border: 0; background: transparent; font: 14px Barlow, sans-serif; color: #16324F">
    </label>
    <div style="flex-grow: 1"></div>
    <button style="min-height: 40px; padding: 0 12px; border: 1px solid #9FB6D1; border-radius: 10px; background: #FFFFFF; color: #16324F; font: 600 14px Barlow, sans-serif">Resumen del día</button>
    <button style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: #FF7B0F; color: #16324F; font: 700 16px 'Barlow Condensed', sans-serif">Dictar</button>
    <button style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: #1F5FAE; color: #FFFFFF; font: 700 16px 'Barlow Condensed', sans-serif">+ Nueva nota</button>
  </header>

  <div style="flex-grow: 1; display: flex; min-height: 0">
    <aside style="width: 290px; flex: none; background: #FFFFFF; border-right: 1px solid #D6E2F0; padding: 14px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">
      <button style="min-height: 40px; border: 0; border-radius: 8px; background: #EAF3FE; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; font: 600 14px Barlow, sans-serif; color: #1F5FAE">Todas las notas<span style="min-width: 26px; padding: 2px 7px; border-radius: 10px; background: #1F5FAE; color: #FFFFFF; font-size: 12px">24</span></button>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 4px">
        <span style="font: 600 12px/1 Barlow, sans-serif; letter-spacing: .6px; text-transform: uppercase; color: #52627A">Grupos filtrados</span>
        <button aria-label="Nuevo grupo filtrado" style="width: 30px; height: 30px; border: 1px solid #D6E2F0; border-radius: 8px; background: #FFFFFF; color: #1F5FAE; font: 600 17px/1 Barlow, sans-serif">+</button>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="10">
        <button style="width: 100%; min-height: 46px; border: 0; border-radius: 8px; padding: 4px 12px; display: flex; align-items: center; gap: 10px; text-align: left; background: transparent">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font: 600 14px Barlow, sans-serif; color: #16324F">{{g.name}}</span>
            <span style="font-size: 12px; color: #52627A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.rule}}</span>
          </span>
          <span style="min-width: 24px; padding: 1px 7px; border-radius: 10px; font: 600 12px Barlow, sans-serif; text-align: center; background: #F4F8FD; color: #52627A">{{g.count}}</span>
        </button>
      </sc-for>
      <div style="flex-grow: 1"></div>
      <div style="border-top: 1px solid #D6E2F0; padding-top: 6px; display: flex; flex-direction: column">
        <button style="min-height: 36px; border: 0; background: transparent; padding: 0 12px; text-align: left; font: 500 14px Barlow, sans-serif; color: #16324F">Historial</button>
        <button style="min-height: 36px; border: 0; background: transparent; padding: 0 12px; text-align: left; font: 500 14px Barlow, sans-serif; color: #16324F">Papelera · 3</button>
        <button style="min-height: 36px; border: 0; background: transparent; padding: 0 12px; text-align: left; font: 500 14px Barlow, sans-serif; color: #16324F">Ajustes</button>
      </div>
    </aside>

    <main style="flex-grow: 1; min-width: 0; padding: 14px 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 12px">
        <h2 style="margin: 0; flex-grow: 1; font: 700 24px/1 'Barlow Condensed', sans-serif">Todas las notas</h2>
        <span style="font-size: 13px; color: #52627A">Agrupar:</span>
        <div style="display: flex; background: #FFFFFF; border: 1px solid #D6E2F0; border-radius: 8px; padding: 2px">
          <button style="min-height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: #EAF3FE; color: #1F5FAE; font: 600 13px Barlow, sans-serif">Fecha</button>
          <button style="min-height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #52627A; font: 600 13px Barlow, sans-serif">Etiqueta</button>
        </div>
        <button style="min-height: 36px; padding: 0 12px; border: 1px solid #9FB6D1; border-radius: 8px; background: #FFFFFF; color: #16324F; font: 600 13px Barlow, sans-serif">Filtros</button>
        <button style="min-height: 36px; padding: 0 12px; border: 1px solid #9FB6D1; border-radius: 8px; background: #FFFFFF; color: #16324F; font: 600 13px Barlow, sans-serif">PDF para reunión</button>
      </div>

      <sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
        <section style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; align-items: baseline; gap: 6px; padding: 0 2px">
            <h3 style="margin: 0; font: 700 16px/1 'Barlow Condensed', sans-serif; color: {{s.ink}}">{{s.name}}</h3>
            <span style="font-size: 12px; color: #52627A">{{s.count}}</span>
          </div>
          <div style="background: #FFFFFF; border: 1px solid #D6E2F0; border-radius: 10px; overflow: hidden">
            <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
              <div style="display: grid; grid-template-columns: 28px 78px minmax(0, 1fr) 200px 130px 150px; align-items: center; gap: 10px; min-height: 40px; padding: 4px 12px; border-top: 1px solid #EEF3FA; font-size: 13px">
                <input type="checkbox" aria-label="Marcar como realizada" style="width: 16px; height: 16px; margin: 0; accent-color: #1F5FAE">
                <span style="display: flex; align-items: center; gap: 6px; font-weight: 600; color: {{r.pInk}}"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{r.dot}}"></span>{{r.prio}}</span>
                <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><b style="font-weight: 600; font-size: 14px">{{r.title}}</b><span style="color: #52627A"> — {{r.body}}</span></span>
                <span style="color: #1F5FAE; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.tags}}</span>
                <span style="color: #52627A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.who}}</span>
                <span style="color: #52627A; white-space: nowrap; text-align: right">{{r.when}}</span>
              </div>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var groups = [
      ['Mallorca 245', '#Mallorca245', '11'], ['Mallorca 245 · Urgentes', '#Mallorca245 · Crítica y Alta', '4'],
      ['Diagonal 120', '#Diagonal120', '7'], ['Nave Sabadell', '#NaveSabadell', '5'],
      ['Encargado', 'Asignadas al encargado', '6'], ['Jefe de producción', 'Asignadas al jefe de producción', '3'],
      ['Industriales', '#Industriales', '8'], ['Seguridad', '#Seguridad', '2'],
      ['Esta semana', 'Vencen antes del domingo', '9'], ['Estancadas', 'Sin tocar desde hace 10 días', '2']
    ].map(function (g) { return { name: g[0], rule: g[1], count: g[2] }; });
    var P = { C: ['Crítica', '#C62828', '#C62828'], A: ['Alta', '#FF7B0F', '#8A3D00'], N: ['Normal', '#1F5FAE', '#1F5FAE'], B: ['Baja', '#52627A', '#52627A'] };
    function r(p, title, body, tags, who, when) { return { prio: P[p][0], dot: P[p][1], pInk: P[p][2], title: title, body: body, tags: tags, who: who, when: when }; }
    var sections = [
      { name: 'Atrasadas', count: '2', ink: '#C62828', rows: [
        r('A', 'Solicitar licencia de grúa', 'Presentar en el ayuntamiento con plano de ocupación y seguro.', '#NaveSabadell', 'Jefe de obra', 'venció 25 sep'),
        r('N', 'Revisar bajantes con el fontanero', 'Comprobar pasos de forjado antes de cerrar falsos techos.', '#Diagonal120 #Instalaciones', 'Sin asignar', 'venció 26 sep')
      ]},
      { name: 'Hoy · martes 29', count: '4', ink: '#1F5FAE', rows: [
        r('N', 'Reunión de obra', 'Llevar PDF de pendientes y planning actualizado.', '#Diagonal120', 'Jefe de obra', '🔔 9:00 · 1 h 30 min'),
        r('C', 'Revisar línea de vida en cubierta', 'Falta tramo junto al lucernario. 2 fotos adjuntas.', '#Mallorca245 #Seguridad', 'Jefe de obra', '⚑ hoy'),
        r('A', 'Llamar al industrial de clima', 'Confirmar fecha de montaje de máquinas en cubierta.', '#NaveSabadell #Instalaciones', 'Sin asignar', '🔔 12:30 · 10 min'),
        r('N', 'Enviar acta a la DF', 'Incluir los acuerdos sobre fachada.', '#Mallorca245', 'Sin asignar', '🔔 17:00 · 10 min')
      ]},
      { name: 'Mañana · miércoles 30', count: '2', ink: '#16324F', rows: [
        r('C', 'Confirmar hormigonado forjado P3', 'Llamar a la planta y confirmar el camión a las 8:00.', '#Mallorca245 #Estructura', 'Encargado', '🔔 7:30 · 10 min'),
        r('A', 'Preparar certificación mensual', 'Mediciones de estructura y albañilería.', '#Mallorca245 #Certificación', 'Jefe de producción', '⚑ mié 30 · cada mes')
      ]},
      { name: 'Esta semana', count: '3', ink: '#16324F', rows: [
        r('A', 'Pedir oferta de carpintería exterior', 'Tres industriales. Incluir persianas de planta baja. Checklist 1/3.', '#Mallorca245 #Carpintería', 'Jefe de producción', '⚑ vie 2 oct'),
        r('N', 'Visita de la Propiedad', 'Recorrido por plantas 1 y 2.', '#Mallorca245', 'Jefe de obra', '🔔 vie 2 · 11:00 · 1 h'),
        r('N', 'Muestras de pavimento', 'Pedir dos acabados para que elija la Propiedad.', '#Mallorca245 #Acabados', 'Sin asignar', '⚑ vie 2 oct')
      ]},
      { name: 'Sin fecha', count: '3', ink: '#52627A', rows: [
        r('B', 'Fotos de avance para el archivo', 'Plantas 1 a 3, fachada principal y patio.', '#Mallorca245', 'Sin asignar', '—'),
        r('B', 'Revisar señalética provisional', 'Cartel de acceso deteriorado por la lluvia.', '#Mallorca245 #Seguridad', 'Encargado', '—'),
        r('N', 'Actualizar planning general', 'Mover fachada una semana.', '#Mallorca245', 'Jefe de obra', '—')
      ]}
    ];
    return { groups: groups, sections: sections };
  }
}
</script>
</body>
</html>
