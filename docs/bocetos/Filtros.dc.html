<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Filtros y grupos filtrados</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:Barlow,system-ui,sans-serif;color:#16324F;background:#F4F8FD}
a{color:#1F5FAE}a:hover{color:#16324F}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; box-sizing: border-box; background: #5A6B80; font-family: Barlow, system-ui, sans-serif; color: #16324F; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end">
  <div style="background: #FFFFFF; border-radius: 18px 18px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #D6E2F0; align-self: center"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font: 700 24px/1 'Barlow Condensed', sans-serif">Filtrar notas</h1>
      <button style="min-height: 44px; border: 0; background: transparent; color: #1F5FAE; font: 600 15px Barlow, sans-serif">Limpiar</button>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font: 700 18px 'Barlow Condensed', sans-serif">Etiquetas</h2>
        <div style="display: flex; background: #F4F8FD; border-radius: 8px; padding: 2px">
          <button style="min-height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: #FFFFFF; color: #16324F; font: 600 13px Barlow, sans-serif">Todas</button>
          <button style="min-height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #52627A; font: 600 13px Barlow, sans-serif">Alguna</button>
        </div>
      </div>
      <input type="search" placeholder="Buscar etiqueta" aria-label="Buscar etiqueta" style="min-height: 44px; border: 1px solid #D6E2F0; border-radius: 8px; padding: 0 12px; font: 15px Barlow, sans-serif">
      <div style="font-size: 13px; color: #52627A">Obras</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{obras}}" as="c" hint-placeholder-count="3">
          <button style="min-height: 38px; padding: 0 12px; border-radius: 19px; font: 600 14px Barlow, sans-serif; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.ink}}">{{c.label}}</button>
        </sc-for>
      </div>
      <div style="font-size: 13px; color: #52627A">Industriales y acciones</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{otras}}" as="c" hint-placeholder-count="4">
          <button style="min-height: 38px; padding: 0 12px; border-radius: 19px; font: 600 14px Barlow, sans-serif; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.ink}}">{{c.label}}</button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font: 700 18px 'Barlow Condensed', sans-serif">Prioridad</h2>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{prio}}" as="p" hint-placeholder-count="4">
          <button style="min-height: 44px; border-radius: 10px; font: 600 14px Barlow, sans-serif; border: 2px solid {{p.border}}; background: {{p.bg}}; color: {{p.ink}}">{{p.label}}</button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font: 700 18px 'Barlow Condensed', sans-serif">Asignada a</h2>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{personas}}" as="c" hint-placeholder-count="3">
          <button style="min-height: 38px; padding: 0 12px; border-radius: 19px; font: 600 14px Barlow, sans-serif; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.ink}}">{{c.label}}</button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0 0 4px; font: 700 18px 'Barlow Condensed', sans-serif">Otros</h2>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 15px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #1F5FAE">Con alarma</label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 15px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #1F5FAE">Vencen esta semana</label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 15px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #1F5FAE">Sin tocar desde hace más de 10 días</label>
    </section>

    <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 4px">
      <button style="min-height: 52px; border: 0; border-radius: 10px; background: #1F5FAE; color: #FFFFFF; font: 700 18px 'Barlow Condensed', sans-serif">Ver 4 notas</button>
      <div style="display: flex; gap: 10px">
        <button style="flex: 1; min-height: 48px; border: 1px solid #9FB6D1; border-radius: 10px; background: #FFFFFF; color: #16324F; font: 600 15px Barlow, sans-serif">Guardar como grupo</button>
        <button style="flex: 1; min-height: 48px; border: 1px solid #9FB6D1; border-radius: 10px; background: #FFFFFF; color: #16324F; font: 600 15px Barlow, sans-serif">PDF para reunión</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var on = { border: '#1F5FAE', bg: '#1F5FAE', ink: '#FFFFFF' };
    var off = { border: '#D6E2F0', bg: '#FFFFFF', ink: '#16324F' };
    function c(label, sel) { return Object.assign({ label: label }, sel ? on : off); }
    return {
      obras: [c('Mallorca 245', true), c('Diagonal 120', false), c('Nave Sabadell', false)],
      otras: [c('Estructura', false), c('Carpintería', false), c('Clima', false), c('Seguridad', false), c('Certificación', false)],
      personas: [c('Jefe de obra', false), c('Encargado', false), c('Jefe de producción', false), c('Sin asignar', false)],
      prio: [
        { label: 'Crítica', border: '#C62828', bg: '#FDECEC', ink: '#C62828' },
        { label: 'Alta', border: '#FF7B0F', bg: '#FFF1E4', ink: '#8A3D00' },
        { label: 'Normal', border: '#D6E2F0', bg: '#FFFFFF', ink: '#52627A' },
        { label: 'Baja', border: '#D6E2F0', bg: '#FFFFFF', ink: '#52627A' }
      ]
    };
  }
}
</script>
</body>
</html>
