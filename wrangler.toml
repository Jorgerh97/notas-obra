# Configuración del worker de Notas de obra (Cloudflare).
# Los secretos ANTHROPIC_API_KEY y APP_TOKEN NO van aquí. Se guardan con:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put APP_TOKEN
name = "notas-obra"
main = "worker/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "notas-obra-db"
database_id = "84f6d093-2026-4e51-97ca-ef4f62b2b0bd"

[[r2_buckets]]
binding = "FOTOS"
bucket_name = "notas-obra-fotos"   # fotos de las notas (fase 3)

[triggers]
crons = ["* * * * *"]       # cada minuto: alarmas, subida a Crítica y tarea diaria

[vars]
ALLOWED_ORIGIN = "https://jorgerh97.github.io"   # https://USUARIO_DE_GITHUB.github.io, sin ruta, en minúsculas

# ---------- Entorno de desarrollo (Fase 4, multiusuario) ----------
# Se publica SOLO con: npx wrangler deploy --env dev
# Usa sus propios recursos; nunca la base ni el bucket de producción. Sin tareas programadas.
# Secretos de este entorno: APP_TOKEN (distinto al de producción). Sin ANTHROPIC_API_KEY.
[env.dev]
name = "notas-obra-dev"
workers_dev = true

[env.dev.ai]
binding = "AI"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "notas-obra-dev-db"
database_id = "0671f628-eadc-478b-bab4-02f492b38a54"

[[env.dev.r2_buckets]]
binding = "FOTOS"
bucket_name = "notas-obra-fotos-dev"

[env.dev.triggers]
crons = []                  # sin avisos, subida a Urgente ni limpieza diaria en desarrollo

[env.dev.vars]
ALLOWED_ORIGIN = "http://localhost:8080"   # la app servida en local (python -m http.server 8080)
